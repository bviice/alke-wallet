<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Depositar Fondos</title>
    <!-- Conexión a Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Conexión a jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="menu.html">Alke Wallet</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal de depósito -->
    <main class="container mt-5">
        <div class="row justify-content-center">
            <section class="col-12 col-md-6">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-4">Depositar a mi cuenta</h3>
                    
                    <!-- Saldo actual -->
                    <div class="alert alert-info text-center" role="alert">
                        Saldo actual: <strong id="saldoActual">$150,000</strong>
                    </div>

                    <!-- Formulario de depósito -->
                    <form id="formDeposito">
                        <div class="mb-3">
                            <label for="montoDeposito" class="form-label">Monto a depositar</label>
                            <input type="number" class="form-control" id="montoDeposito" placeholder="Ej: 50000" required min="1">
                        </div>
                        <div class="mb-3">
                            <label for="origenFondos" class="form-label">Medio de pago</label>
                            <select class="form-select" id="origenFondos">
                                <option value="1">Cuenta Bancaria Terminada en 1234</option>
                                <option value="2">Tarjeta de Crédito</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Realizar depósito</button>
                        <a href="menu.html" class="btn btn-outline-secondary w-100 mt-2">Cancelar</a>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
