<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Enviar Dinero</title>
    <!-- Conexión a Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Conexión a jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="menu.html">Alke Wallet</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal de envío de dinero -->
    <main class="container mt-5">
        <div class="row justify-content-center">
            <section class="col-12 col-md-6">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-4">Enviar Dinero</h3>
                    
                    <form id="formEnviarDinero">
                        <!-- Campo de búsqueda preparado para autocompletado -->
                        <div class="mb-3">
                            <label for="buscarContacto" class="form-label">Buscar Contacto</label>
                            <input type="text" class="form-control" id="buscarContacto" placeholder="Nombre o correo del contacto..." required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="montoEnviar" class="form-label">Monto a enviar</label>
                            <input type="number" class="form-control" id="montoEnviar" placeholder="Ej: 15000" min="1" required>
                        </div>
                        
                        <!-- Botones de acción -->
                        <button type="submit" class="btn btn-primary w-100">Simular transferencia</button>
                        
                        <hr class="my-4">
                        
                        <!-- Botón para el evento de agregar contacto -->
                        <button type="button" id="btnAgregarContacto" class="btn btn-outline-success w-100 mb-2">Agregar nuevo contacto</button>
                        <a href="menu.html" class="btn btn-outline-secondary w-100">Cancelar</a>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
