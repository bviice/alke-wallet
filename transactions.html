<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Últimos Movimientos</title>
    <!-- Conexión a Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Conexión a jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="menu.html">Alke Wallet</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal del historial -->
    <main class="container mt-5">
        <h3 class="mb-4">Últimos Movimientos</h3>
        
        <div class="card shadow">
            <div class="card-body">
                <!-- Tabla responsive de Bootstrap para visualización de datos -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Fecha</th>
                                <th>Descripción</th>
                                <th>Tipo</th>
                                <th>Monto</th>
                            </tr>
                        </thead>
                        <tbody id="tablaTransacciones">
                            <!-- Datos simulados de ejemplo -->
                            <tr>
                                <td>24/09/2026</td>
                                <td>Transferencia a Contacto</td>
                                <td><span class="badge bg-danger">Envío</span></td>
                                <td class="text-danger">-$15,000</td>
                            </tr>
                            <tr>
                                <td>23/09/2026</td>
                                <td>Depósito desde Cuenta Bancaria</td>
                                <td><span class="badge bg-success">Ingreso</span></td>
                                <td class="text-success">+$50,000</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="text-center mt-3">
                    <a href="menu.html" class="btn btn-outline-primary">Volver al Menú</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
