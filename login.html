<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Iniciar Sesión</title>
    <!-- Conexión a Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body class="bg-light d-flex align-items-center vh-100">

    <!-- Uso de etiqueta semántica main -->
    <main class="container">
        <div class="row justify-content-center">
            <section class="col-12 col-md-6 col-lg-4">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-4">Bienvenido a Alke Wallet</h2>
                    
                    <!-- Formulario de inicio de sesión con clases de Bootstrap -->
                    <form id="loginForm" action="menu.html">
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>

                </div>
            </section>
        </div>
    </main>

    <!-- Conexión a los scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
